<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>

    <meta name="description" content="A responsive picture album showcasing temple view and pictures.">
    <meta name="author" content="Charles Chiparo">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS & js Files (Mobile First) -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <div class="header-container">
            <h1>Temple Album</h1>
            <button id="menu" aria-label="Toggle Navigation"></button>
        </div>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h2>Featured Temples</h2>
        <div class="res-grid">
            <figure>
                <img src="images/salt-lake.jpg" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/nauvootemple.jpg" alt="Nauvoo Temple" loading="lazy">
                <figcaption>Nauvoo Temple</figcaption>
            </figure>
            <figure>
                <img src="images/kirt.jpg" alt="Kirtland Temple" loading="lazy">
                <figcaption>Kirtland Temple</figcaption>
            </figure>
            <figure>
                <img src="images/paris-france.jpg" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="images/italy.jpg" alt="Rome Italy Temple" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>
            <figure>
                <img src="images/tokyo.jpg" alt="Tokyo Japan Temple" loading="lazy">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <figure>
                <img src="images/johannesburg.jpg" alt="Johannesburg South Africa Temple" loading="lazy">
                <figcaption>Johannesburg South Africa Temple</figcaption>
            </figure>
            <figure>
                <img src="images/durban.jpg" alt="Durban South Africa Temple" loading="lazy">
                <figcaption>Durban South Africa Temple</figcaption>
            </figure>
            <figure>
                <img src="images/hawaii.jpg" alt="Laie Hawaii Temple" loading="lazy">
                <figcaption>Laie Hawaii Temple</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> 🌺 Charles Chiparo 🌺 South Africa.</p>
    <p>Last Updated: <span id="lastModified"></span></p>
    </footer>
    
</body>
</html>
