<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/review.js" defer></script>
</head>
<body>
    <header>
        <h1>Submission Received</h1>
    </header>

    <main class="confirmation-container">
        <h2>Thank You for Your Review!</h2>
        <p>Your feedback helps us improve our products and services.</p>
        
        <div class="counter-card">
            <p>Total Reviews Completed on this Browser:</p>
            <span id="reviewCounter" class="counter-number">0</span>
        </div>

        <a href="form.html" class="btn-primary">Submit Another Review</a>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> | Product Review Portal | All Rights Reserved</p>
    </footer>
</body>
</html>
