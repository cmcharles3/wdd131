<!-- W05 Project: Website Planning Document
Overview
Planning is a critical step in the success of any project. The website plan serves as a blueprint for designing and developing your project. The purpose of this assignment is for you to organize your plans for your proposed project.

The site plan is a living document that will change as the project progresses. It is used to communicate with the client and the development team – which in this case, is just you.

Instructions
The assignment is to build a basic website plan in HTML. This will be a single document and the required content is outlined below.

Remember that this is just a plan and you may need to adjust some items as you complete your project in the next week.

Setup
Refer to the project description, which provides overall site specifications.
Create a new subfolder named "project" in your wdd131 folder and create a new HTML file name "siteplan.html" within the project subfolder that you just created. This HTML document will be your website planning document.
All of your project files in the next week will also be located within this project folder.

Content
Include the following content and use appropriate HTML elements to outline these sections with descriptions in the site plan document:

Site Name: The site or domain name (along with a logo) is the primary identifier and is critical for branding, visibility, and recognition. Securing a domain name that is available to purchase is normally important but not required in this class. You will need to provide a valid site name relevant to your project, along with a short description of why you chose it.
Example: Bay Area eBiking Club
• This name represents a club that is focused on electric biking in the San Francisco Bay Area.
Optional domain availability: bay-ebike.org

Site Purpose: The site purpose describes your site's scope as well as the services and information that will be provided.
Example: for the Bay Area eBiking Club
• The site provides a hub for regional e-biking by providing trail and e-bike recommendation information along with a membership information form.

Scenarios: Scenarios are questions asked by a site visitor who represents the organization's target audience. The questions will help you drive the content of the website as it provides answers to the questions. Again, much of the content specifications will actually be provided but start thinking about the target audience of the site. Include at least two scenarios.
Example: for the Bay Area eBiking Club
• What is the best e-bike to get for mountainous areas?
• Where can I find contact information for the club's directors?

Color Schema: The color schema refers to the carefully selected site colors. Define at least two colors and show where each color selected will be used, such as headings, paragraphs, background colors, accents, and so on.
! Use your selected color schema on this document.
How to Choose Good Website Color Schemes – websitebuilderexpert.com

Typography: The typography section of the planning document provides examples of the fonts to be used and where they are to be applied. You should select no less than one font and no more than three fonts. Indicate where each font will be used (such as headings, body, and so on). Other fonts can be used for special circumstances or sections as needed.
Choosing Web Fonts Beginners Guide – Google Design

Wireframes: Design wireframes of your project's home page layout in the mobile and desktop (wider) views. Wireframe diagrams can be simple and do not need to have actual content, just representations of content and their layout relationship.
What is a Wireframe? – evolve
Remember that earlier in the course you worked with a given wireframe. Country/Place Page
CSS
Add supporting CSS files as needed. The styling can be basic.
Be sure to use your selected color schema and typography listed in this plan on your site plan document. -->
