<!-- This app allows users to enter their favorite Book of Mormon chapters and display them in a list that updates automatically on the screen. 
Entries can then be deleted from the list.

1. Create an HTML file named "bom.html" in the week02 folder.
2. Your bom.html HTML document should include the basic meta tags and an appropriate title.
-->

<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Book of Mormon - Top 10</title>
</head>
<body>
	<h1>📖 Book of Mormon - Top 10</h1>
<main>
	<label for="favchap">Enter Book and Chapter: </label>
	<input type="text" id="favchap" placeholder="Alma 5">
	<button type="submit">Add Chapter</button>
	<ul id="list"></ul>
</main>
	
</body>
</html>
