<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your product review for Cedar3 Technology products. Share your experience and rate the product.">
    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            
            <!-- Product Name -->
            <div class="form-item">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-item rating-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="stars">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5" title="5 stars">&#9733;</label>

                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4" title="4 stars">&#9733;</label>

                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3" title="3 stars">&#9733;</label>

                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2" title="2 stars">&#9733;</label>

                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1" title="1 star">&#9733;</label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-item">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-item">
                <legend>Useful Features (Check all that apply)</legend>
                
                <div class="checkbox-item">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                    <label for="feature-ease">Ease of Use</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Design / Aesthetics</label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-item">
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review" rows="5" placeholder="Share your experience..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-item">
                <label for="userName">User Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName" placeholder="e.g. Jane Doe">
            </div>

            <!-- Submit Button -->
            <div class="form-item">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> | Product Review Portal | All Rights Reserved</p>
    </footer>
</body>
</html>
